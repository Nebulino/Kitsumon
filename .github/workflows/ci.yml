name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: dart-lang/setup-dart@v1

    - name: Install dependencies
      run: dart pub get

    - name: Run build_runner
      run: dart run build_runner build


    - name: Run static analysis
      run: dart analyze

    - name: Run tests
      run: dart test
