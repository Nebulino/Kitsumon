name: Publish to pub.dev

# Pub.dev → package → Admin → "Automated publishing" must be enabled with:
#   repository:  Nebulino/Kitsumon
#   tag pattern: v{{version}}
# Then publish with:
#   git tag v0.3.0 && git push origin v0.3.0
# (`version:` in pubspec.yaml must match the tag, minus the leading "v")
#
# NOTE: this package does not exist on pub.dev yet — the first publication must
# be done once by hand (`dart pub publish`) so the package exists and can be
# claimed by the nebulino.cloud verified publisher. Only then can automated
# publishing be configured in its Admin tab.

on:
  # Manual run: in the GitHub UI pick the TAG as the ref, not a branch —
  # OIDC only authorizes runs whose ref matches the tag pattern on pub.dev.
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      id-token: write   # required for OIDC authentication to pub.dev
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

